name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    # Weekly, so a CVE published after merge still surfaces.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV vulnerability scan
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false on every checkout — nothing here needs git
      # auth after the clone, and a stored token can leak via artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the image rather than google/osv-scanner-action, whose own
      # README warns its behavior can change in a patch release.
      #
      # Do not add --include-git-root. With it the checkout's .git counts as a
      # package, so a scan that finds no lockfile exits 0. Without it that scan
      # exits 128 and fails the step.
      # pnpm 12 stores manager and project dependencies as separate YAML
      # documents. OSV 2.5.1 reads only the first, so expose each document as
      # its own pnpm-lock.yaml for both root and vendored script dependencies.
      #
      # The v2.5.1 tag is mutable, so the digest is what actually pins this.
      # Resolved with: docker buildx imagetools inspect ghcr.io/google/osv-scanner:v2.5.1
      - name: Scan lockfiles
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          target = Path(os.environ["RUNNER_TEMP"]) / "osv-pnpm"
          lockfiles = [
              Path("pnpm-lock.yaml"),
              Path("plugins/pstack/skills/poteto-mode/scripts/pnpm-lock.yaml"),
          ]
          for lock_index, lockfile in enumerate(lockfiles):
              for document_index, document in enumerate(re.split(r"(?m)^---\s*$", lockfile.read_text())):
                  if not document.strip():
                      continue
                  folder = target / f"{lock_index}-{document_index}"
                  folder.mkdir(parents=True, exist_ok=True)
                  (folder / "pnpm-lock.yaml").write_text(document)
          PY
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/osv-pnpm:/pnpm-lockfiles:ro" \
            ghcr.io/google/osv-scanner:v2.5.1@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --recursive /src /pnpm-lockfiles

  zizmor:
    name: Workflow static analysis
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Audits the workflows themselves: template injection, over-broad
      # permissions, unpinned actions, credential persistence.
      #
      # advanced-security defaults to true and needs GitHub Advanced Security,
      # which this repo does not have; annotations put findings on the diff
      # instead. version defaults to "latest" — pinned so a zizmor release
      # cannot change what this gate means.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.29.0"
          advanced-security: false
          annotations: true
          persona: pedantic
          min-severity: low
